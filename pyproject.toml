[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Evidence-grounded research agent with auditable citations and resumable runs"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "openai>=1,<3",
  "pypdf>=5,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
